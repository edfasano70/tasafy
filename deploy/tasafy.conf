<VirtualHost *:80>
    ServerName tasafy.45.79.220.248.sslip.io
    ServerAdmin edfasano70@gmail.com
    DocumentRoot /var/www/tasafy

    <Directory /var/www/tasafy>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.(sql|md|txt)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "(^\.|~$)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/tasafy-error.log
    CustomLog ${APACHE_LOG_DIR}/tasafy-access.log combined
</VirtualHost>
